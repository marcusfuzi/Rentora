<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account – Rentora Marketplace</title>
  
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    .auth-page-wrap {
      min-height: calc(100vh - 80px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
    }

    .auth-card {
      width: 100%;
      max-width: 520px;
      padding: 2.5rem;
      border-radius: var(--radius-lg);
    }

    .reg-role-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.35rem;
      border-radius: var(--radius-full);
      margin-bottom: 2rem;
      border: 1px solid var(--border-light);
    }

    .reg-role-tab {
      padding: 0.7rem;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .reg-role-tab.active {
      background: var(--gradient-primary);
      color: #fff;
      box-shadow: 0 2px 10px var(--primary-glow);
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/index.html" class="nav-brand">
        <div class="brand-logo-icon"><i class="fas fa-cube"></i></div>
        <span>RENT<span class="gradient-text">ORA</span></span>
      </a>

      <ul class="nav-links" id="nav-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/marketplace.html" class="nav-link">Marketplace</a></li>
        <li><a href="/calculator.html" class="nav-link">Rent vs Buy</a></li>
      </ul>

      <div class="nav-actions" id="nav-actions">
        <a href="/login.html" class="btn btn-secondary btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <div class="auth-page-wrap">
    <div class="glass-panel auth-card">
      <div style="text-align: center; margin-bottom: 1.8rem;">
        <h2 style="font-family: var(--font-heading); font-size: 1.8rem; font-weight: 800; color: #fff; margin-bottom: 0.4rem;">
          Join Rentora
        </h2>
        <p style="color: var(--text-muted); font-size: 0.9rem;">
          Choose your account type and start exploring or listing
        </p>
      </div>

      <!-- Account Role Selector -->
      <div class="reg-role-tabs">
        <div class="reg-role-tab active" data-role="customer">
          <i class="fas fa-user"></i> Customer Account
        </div>
        <div class="reg-role-tab" data-role="seller">
          <i class="fas fa-store"></i> Seller Account
        </div>
      </div>

      <!-- Registration Form -->
      <form id="register-form">
        <div style="margin-bottom: 1.2rem;">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="e.g. Aryan Sharma" required />
        </div>

        <div style="margin-bottom: 1.2rem;">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required />
        </div>

        <div style="margin-bottom: 1.2rem;">
          <label class="form-label" for="reg-phone">Phone Number</label>
          <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98765 43210" />
        </div>

        <div style="margin-bottom: 1.5rem;">
          <label class="form-label" for="reg-password">Password (min 6 characters)</label>
          <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="6" required />
        </div>

        <!-- Additional Seller Specific Fields -->
        <div id="seller-specific-fields" style="display: none; padding: 1.2rem; background: rgba(99, 102, 241, 0.08); border: 1px solid rgba(99, 102, 241, 0.25); border-radius: var(--radius-md); margin-bottom: 1.5rem;">
          <div style="font-size: 0.85rem; font-weight: 700; color: var(--accent-cyan); text-transform: uppercase; margin-bottom: 1rem; letter-spacing: 0.5px;">
            <i class="fas fa-briefcase"></i> Seller Business Details
          </div>

          <div style="margin-bottom: 1rem;">
            <label class="form-label" for="reg-store-name">Store / Studio Name</label>
            <input type="text" id="reg-store-name" class="form-control" placeholder="e.g. Apex Cine Rentals" />
          </div>

          <div style="margin-bottom: 1rem;">
            <label class="form-label" for="reg-store-desc">Store Description</label>
            <textarea id="reg-store-desc" class="form-control" rows="2" placeholder="Briefly describe what gear you rent or sell..."></textarea>
          </div>

          <div>
            <label class="form-label" for="reg-gst">GSTIN or Business ID (Optional)</label>
            <input type="text" id="reg-gst" class="form-control" placeholder="29ABCDE1234F1Z5" />
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem;">
          Create My Account
        </button>
      </form>

      <div style="text-align: center; margin-top: 1.8rem; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="/login.html" style="color: var(--accent-cyan); font-weight: 600;">Sign in here</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Auto-select seller tab if ?role=seller is in URL
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('role') === 'seller') {
      document.querySelector('.reg-role-tab[data-role="seller"]')?.click();
    }
  </script>
</body>
</html>
